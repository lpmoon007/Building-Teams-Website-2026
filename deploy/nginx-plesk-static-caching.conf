# Plesk nginx — static-asset browser caching for buildingteams.com
#
# WHY: This site is static HTML on a Plesk nginx+Apache VPS. nginx serves
# existing static files directly and never consults Apache/.htaccess for them,
# so the Cache-Control rules in .htaccess (fonts/CSS/JS/images) are bypassed for
# real assets. These directives re-apply the same TTLs at the nginx layer.
#
# WHERE TO PASTE:
#   Plesk > Websites & Domains > buildingteams.com >
#   Apache & nginx Settings > "Additional nginx directives"
#   Add BELOW the existing gzip lines. Do NOT remove the gzip block.
#   Click Apply (Plesk validates syntax; if it rejects, send me the error).
#
# TTLs (identical to .htaccess):
#   woff2 fonts .............. 1 year, immutable
#   css / js ................. 7 days
#   images & media ........... 30 days
# Third-party analytics scripts load from their own hosts and are unaffected.

location ~* \.woff2$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~* \.(?:css|js)$ {
    add_header Cache-Control "public, max-age=604800";
}

location ~* \.(?:png|jpe?g|gif|ico|svg|webp|avif|mp4|webm)$ {
    add_header Cache-Control "public, max-age=2592000";
}

# ---- OPTIONAL: HSTS (also bypassed with .htaccess) ----
# Your Plesk SSL/TLS + HTTP->HTTPS redirect already force HTTPS. This just adds
# the header your .htaccess intended. Put it OUTSIDE the location blocks above
# (server scope) so it applies to page responses. Only add if a header check
# shows it's missing:
#
# add_header Strict-Transport-Security "max-age=31536000" always;
